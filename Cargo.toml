[package]
name = "apex"
version = "1.0.1"
edition = "2021"
description = "APEX — Static analysis for APK/IPA (mlab.sh), Rust edition"
license = "GPL-3.0-only"

[[bin]]
name = "apex"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
zip = "2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.13"
axmldecoder = "0.5"
roxmltree = "0.20"
goblin = "0.8"
walkdir = "2"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cms = "0.2"
x509-cert = "0.2"
const-oid = { version = "0.9", features = ["db"] }
der = "0.7"
rsa = "0.9"
unicode-width = "0.1"
adb_client = { version = "3.2.2", default-features = false, features = ["usb"] }

[profile.release]
opt-level = 3
lto = "thin"
